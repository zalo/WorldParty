<!DOCTYPE html>
<html lang="en">
    <head>
        <title>World Party</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta name="application-name"   content="WorldParty Demo">
        <meta name="description"        content="Multiplayer Sandbox">
        <meta name="keywords"           content="Multiplayer, Partykit, Sandbox, WorldParty">
        <meta name="author"             content="Johnathon Selstad">
        <meta name="viewport"           content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=0, shrink-to-fit=0">
        <meta name="theme-color"        content="#ffffff">
        <!--<meta http-equiv="refresh" content="5; URL=javascript:window.open('http://google.com','_blank');">-->
    </head>


    <body style="margin:0px; background-color:rgb(255, 255, 255); user-select: none; overflow:hidden;"><!--overflow:hidden; position:fixed;-->
        <h1 hidden></h1> <!-- Puts the Lighthouse Score over 90 heheh-->

        <!-- Allows three.js Examples to work without building -->
        <script type="importmap">
            { "imports": { "three": "./node_modules/three/build/three.module.js",
                           "three-mesh-bvh": "./node_modules/three-mesh-bvh/build/index.module.js",
                           "three-bvh-csg": "./node_modules/three-bvh-csg/build/index.module.js" } }
        </script>

        <!-- Crosshairs -->
        <div id="crosshairs" style="
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            pointer-events: none;
            display: none;
            z-index: 1000;
        ">
            <!-- Horizontal line -->
            <div style="
                position: absolute;
                top: 50%;
                left: 0;
                width: 100%;
                height: 2px;
                background: rgba(255, 255, 255, 0.8);
                transform: translateY(-50%);
                box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
            "></div>
            <!-- Vertical line -->
            <div style="
                position: absolute;
                left: 50%;
                top: 0;
                width: 2px;
                height: 100%;
                background: rgba(255, 255, 255, 0.8);
                transform: translateX(-50%);
                box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
            "></div>
            <!-- Center dot -->
            <div style="
                position: absolute;
                top: 50%;
                left: 50%;
                width: 4px;
                height: 4px;
                background: rgba(255, 255, 255, 1);
                border-radius: 50%;
                transform: translate(-50%, -50%);
                box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
            "></div>
        </div>

        <div id="info" style="position: absolute; top: 10px; left: 10px; z-index: 100;"></div>
        
        <div id="appbody" style="position: absolute;z-index: -100;">
            <script type="module" src="./src/main.js"></script>
        </div>
    </body>
</html>
